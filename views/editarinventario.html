        <!--CONTENIDO DEL DASHBOARD/(Area de trabajo)- TAREA: Contenido del Dasboard 12/01/2026-->
        <div class="modal-container"> 
        <!-- Editar productos-->
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-box-open"></i> Editar Producto</h3>
                    <button class="close-modal" type="button" title="Cerrar">&times;</button>
                </div>
                <form action="" method="post" class="modal-form">
                    <div class="form-section">
                        <h4>Información del Inventario</h4>
                        <div class="input-group">
                            <label for="prod-name">Nombre del Producto:</label>
                            <input type="text" id="prod-name" name="prod-name" value="Laptop Toshiba" required>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label for="prod-category">Categoría:</label>
                                <select id="prod-category" name="prod-category" required>
                                    <option value="electronica" selected>Electrónica</option>
                                    <option value="hogar">Hogar</option>
                                    <option value="oficina">Oficina</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="prod-sku">Código / SKU:</label>
                                <input type="text" id="prod-sku" name="prod-sku" value="PROD-001">
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h4>Valores y Existencia</h4>
                        <div class="form-row">
                            <div class="input-group">
                                <label for="prod-stock">Stock Actual:</label>
                                <input type="number" id="prod-stock" name="prod-stock" value="24" required>
                            </div>
                            <div class="input-group">
                                <label for="prod-price">Precio Unitario (Bs):</label>
                                <input type="number" step="0.01" id="prod-price" name="prod-price" value="2660.75" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-footer">
                        <div class="form-actions">
                            <button type="button" class="btn-secondary">Cancelar</button>
                            <button type="submit" class="btn-primary">Guardar Cambios</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
